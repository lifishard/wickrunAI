name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建不发布（发布时请选择版本标签）
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查和测试
        run: |
          npm run typecheck
          npm test
      - name: 构建前端
        run: npm run build:fast
      - name: 准备 macOS 签名凭据
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: node scripts/prepare-mac-signing.mjs
        env:
          MACOS_SIGNING_ENABLED: 'true'
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # Unsigned packaging can retry transient Electron download failures.
      - name: 打包
        if: runner.os != 'macOS' || vars.MACOS_SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder ${{ matrix.args }} --publish never; then exit 0; fi
            echo "::warning::打包第 ${attempt} 次失败，15 秒后重试"
            sleep 15
          done
          echo "::error::打包连续三次失败，请查看上面的日志"
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Do not retry notarization automatically: a request may still be running at Apple.
      - name: macOS Developer ID 签名与公证
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: npx electron-builder --mac --config build/mac-signed.cjs --publish never
        env:
          MACOS_SIGNING_ENABLED: 'true'
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: 验证两个架构的 DMG 和 ZIP 签名、公证票据及 Gatekeeper
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: node scripts/verify-mac-release.mjs release
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: 清理临时公证私钥
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: node scripts/prepare-mac-signing.mjs --cleanup
      - name: 保存平台产物
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/mac-signing-verification.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 验证并发布三平台安装包
    needs: build
    # CI dispatches a verified, immutable version tag after main passes checks.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: 核对八个安装包、生成校验文件并公开 Release
        run: node scripts/publish-release.mjs release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
