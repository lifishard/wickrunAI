name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 从现有不可变版本标签构建（留空使用当前 ref）
        type: string
        default: ''
      dry_run:
        description: 只构建不发布（发布时请选择版本标签）
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 统一临时目录的真实路径
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const temp = fs.realpathSync.native(os.tmpdir());
          fs.appendFileSync(process.env.GITHUB_ENV, ['TMPDIR', 'TMP', 'TEMP'].map(key => `${key}=${temp}`).join('\n') + '\n');
          NODE
      - name: 安装依赖
        run: npm ci
      - name: 类型检查和测试
        run: |
          npm run typecheck
          npm test
      - name: 构建前端
        run: npm run build:fast
      # electron-builder 要先从 GitHub 下载 116MB 的 Electron 二进制，这一步
      # 偶发被对端掐断（wsarecv: An existing connection was forcibly closed），
      # 跟代码无关，Windows 上尤其常见。失败就整步重来，已经下好的分片留在
      # 本地缓存里不会重复下载。三次都失败才算真的失败。
      - name: 打包
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder ${{ matrix.args }} --publish never; then exit 0; fi
            echo "::warning::打包第 ${attempt} 次失败，15 秒后重试"
            sleep 15
          done
          echo "::error::打包连续三次失败，请查看上面的日志"
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 保存平台产物
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 读取同版本 Android 的固定源码与签名
        id: android-source
        run: node scripts/android-release-source.mjs
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.android-source.outputs.commit }}
          path: android-source
      - name: 验证 Android 不可变标签
        working-directory: android-source
        env:
          ANDROID_SOURCE_TAG: ${{ steps.android-source.outputs.tag }}
          ANDROID_SOURCE_COMMIT: ${{ steps.android-source.outputs.commit }}
        run: |
          git fetch --depth=1 origin "refs/tags/$ANDROID_SOURCE_TAG:refs/tags/$ANDROID_SOURCE_TAG"
          test "$(git rev-parse "$ANDROID_SOURCE_TAG^{commit}")" = "$ANDROID_SOURCE_COMMIT"
      - name: 检查固定源码的 Android 客户端
        working-directory: android-source
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: 读取本机固定签名的候选 APK（密钥保留本机）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ANDROID_SOURCE_TAG: ${{ steps.android-source.outputs.tag }}
          ANDROID_VERSION: ${{ steps.android-source.outputs.version }}
        run: |
          mkdir -p signed-android
          gh release download "$ANDROID_SOURCE_TAG" --pattern "wickrunAI-${ANDROID_VERSION}-android-preview.apk" --dir signed-android
      - name: 验证真实 APK 版本、源码、签名和校验值
        shell: bash
        run: |
          set -euo pipefail
          # Match the stable tools used to verify the locally signed candidate.
          # Do not let new runner SDKs silently change the verifier output format.
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apksigner="$tools/apksigner"
          aapt="$tools/aapt"
          test -x "$apksigner"
          test -x "$aapt"
          version=$(node -p 'require("./package.json").version')
          "$apksigner" verify --verbose --print-certs "signed-android/wickrunAI-${version}-android-preview.apk"
          node scripts/verify-android-release.mjs android-source release "$apksigner" "$aapt" "signed-android/wickrunAI-${version}-android-preview.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: packages-Android
          path: |
            release/*-android-preview.apk
            release/android-signature.txt
            release/android-build-info.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 验证并发布四平台安装包
    needs: [build, android]
    # CI dispatches a verified, immutable version tag after main passes checks.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: 核对九个安装包、生成校验文件并公开 Release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          expected_ref="refs/tags/v${version}"
          if [[ "$SOURCE_REF" != "$expected_ref" && "$SOURCE_REF" != "v${version}" ]]; then
            echo "::error::发布必须使用与 package.json 一致的不可变版本标签"
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "${expected_ref}^{commit}")
          if [[ "$source_commit" != "$tag_commit" ]]; then
            echo "::error::构建源码与版本标签不一致"
            exit 1
          fi
          export GITHUB_REF="$expected_ref"
          export GITHUB_SHA="$source_commit"
          node scripts/publish-release.mjs release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.release_tag || github.ref }}
