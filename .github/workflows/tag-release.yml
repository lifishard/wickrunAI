name: Tag Release

# Creates the version tag vX.Y.Z (read from package.json) on the current main commit and
# starts the Release workflow for it. Use it when the tag cannot be pushed from where the
# release was prepared. An existing tag is never moved.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建不发布
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: 创建版本标签并启动发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 创建标签并启动 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::只能从 main 创建版本标签"; exit 1; fi
          tag="v$(node -p "require('./package.json').version")"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$tag 已指向 $existing，不会移动已有标签"; exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
            echo "已创建 $tag → $GITHUB_SHA"
          fi
          gh workflow run release.yml --ref "$tag" -f release_tag="$tag" -f dry_run="$DRY_RUN"
          echo "已启动 $tag 的 Release 工作流"
